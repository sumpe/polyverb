<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1511" media="(prefers-color-scheme: dark)">
<title>Piotrek's Polyverb Tincture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#f4ede1;
  --card:#fbf7f0;
  --sunk:#ece2d2;
  --ink:#2a201a;
  --muted:#6e5e51;
  --line:#e3d8c7;
  --edge:#958269;
  --hover:rgba(42,32,26,.05);
  --lift:rgba(42,32,26,.14);
  --focus:#2a201a;
  --shadow:0 1px 1px rgba(42,32,26,.04),0 14px 34px -18px rgba(70,45,20,.28);
  --ok:#2c6640;
  --okbg:#e2ecdc;
  --bad:#9a3426;
  --badbg:#f5e0d9;
  --accent:#7a4b2c;
  --accent-hi:#663d23;
  --on-accent:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1511;
    --card:#241c17;
    --sunk:#2e251f;
    --ink:#efe5d6;
    --muted:#a9998a;
    --line:#382d25;
    --edge:#7a6655;
    --hover:rgba(239,229,214,.06);
    --lift:rgba(0,0,0,.45);
    --focus:#efe5d6;
    --shadow:0 1px 1px rgba(0,0,0,.2),0 14px 34px -18px rgba(0,0,0,.7);
    --ok:#95d3a5;
    --okbg:#1d3123;
    --bad:#f29d90;
    --badbg:#40231c;
    --accent:#d9a77f;
    --accent-hi:#e4b994;
    --on-accent:#24160c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1511;
  --card:#241c17;
  --sunk:#2e251f;
  --ink:#efe5d6;
  --muted:#a9998a;
  --line:#382d25;
  --edge:#7a6655;
  --hover:rgba(239,229,214,.06);
  --lift:rgba(0,0,0,.45);
  --focus:#efe5d6;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 14px 34px -18px rgba(0,0,0,.7);
  --ok:#95d3a5;
  --okbg:#1d3123;
  --bad:#f29d90;
  --badbg:#40231c;
  --accent:#d9a77f;
  --accent-hi:#e4b994;
  --on-accent:#24160c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:clamp(40px,10vh,88px) 20px 56px}
.eyebrow{margin:0 0 12px;color:var(--muted);font:700 .72rem/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font:600 clamp(2.3rem,9vw,3rem)/1.05 var(--serif);letter-spacing:-.01em;text-wrap:balance}
h1 em{font-weight:400;color:var(--accent)}
.sub{margin:16px 0 0;max-width:34ch;color:var(--muted);font:italic 400 1.15rem/1.45 var(--serif)}
.menu{margin:36px 0 0;padding:0;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.menu li+li{border-top:1px solid var(--line)}
.menu a{display:flex;align-items:center;gap:16px;min-height:76px;padding:18px 20px;color:inherit;text-decoration:none;transition:background-color .15s}
.menu a:focus-visible{outline-offset:-3px;border-radius:18px}
.flag{flex:none;width:36px;height:26px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pt{background:linear-gradient(90deg,#2d6a4f 0 40%,#c0392b 40%)}
.pl{background:linear-gradient(#fff 0 50%,#b8323f 50%)}
.txt{flex:1;min-width:0}
.name{display:block;font:600 1.35rem/1.2 var(--serif)}
.desc{display:block;margin-top:3px;color:var(--muted);font-size:.9rem;line-height:1.4}
.go{flex:none;color:var(--muted);font-size:1.1rem;transition:transform .15s,color .15s}
@media (hover:hover){
  .menu a:hover{background:var(--hover)}
  .menu a:hover .go{color:var(--accent);transform:translateX(3px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Verb conjugation trainers</p>
  <h1>Piotrek's <em>Polyverb</em> Tincture</h1>
  <p class="sub">A small dose of verbs.</p>
  <ul class="menu">
    <li><a href="portuguese/index.html">
      <span class="flag pt" aria-hidden="true"></span>
      <span class="txt"><span class="name">Português</span><span class="desc">European Portuguese verbs, nine tenses</span></span>
      <span class="go" aria-hidden="true">→</span>
    </a></li>
    <li><a href="polish/index.html">
      <span class="flag pl" aria-hidden="true"></span>
      <span class="txt"><span class="name">Polski</span><span class="desc">Polish regular verbs, present, past, future, conditional</span></span>
      <span class="go" aria-hidden="true">→</span>
    </a></li>
  </ul>
</main>
</body>
</html>
