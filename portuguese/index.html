<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peter’s Portuguese Verb Drill 🍪</title>
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--text:#16202e;--muted:#5d6b7e;--line:#d3dbe8;
  --accent:#1f4e9c;--accent-text:#ffffff;--ok:#1b7a47;--okbg:#e1f3e8;--bad:#b3261e;--badbg:#fbe9e7;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151d;--card:#1a212c;--text:#e8edf4;--muted:#9aa7b8;--line:#2f3a49;
    --accent:#6fa2ec;--accent-text:#0b1524;--ok:#6fd19a;--okbg:#163625;--bad:#f2a29b;--badbg:#3b1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151d;--card:#1a212c;--text:#e8edf4;--muted:#9aa7b8;--line:#2f3a49;
  --accent:#6fa2ec;--accent-text:#0b1524;--ok:#6fd19a;--okbg:#163625;--bad:#f2a29b;--badbg:#3b1f1d;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{font:600 1.7rem/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.lbl{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:8px;margin-bottom:22px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;font:inherit;font-size:1.1rem;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.seg.tight{margin-bottom:8px}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 22px}
.switch{display:flex;align-items:center;gap:12px;margin-bottom:16px;cursor:pointer;position:relative}
#start{margin-top:10px}
.switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.track{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{left:21px}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:1.05rem;font-weight:600;cursor:pointer}
.ghost{width:100%;padding:12px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font-size:1rem;cursor:pointer}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px}
#fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.verb{font:600 3rem/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;text-align:center}
.tense{display:table;margin:10px auto 0;padding:4px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-weight:600}
.who{text-align:center;color:var(--muted);margin:8px 0 22px;font-size:1.05rem}
#ans{width:100%;padding:14px;font:inherit;font-size:1.3rem;text-align:center;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
#ans:focus{outline:none;border-color:var(--accent)}
#ans.ok{border-color:var(--ok);background:var(--okbg)}
#ans.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin:12px 0 0;padding:10px 12px;border-radius:8px;text-align:center;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
#go{margin-top:16px}
#res{font:600 3rem/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;text-align:center}
#pct{text-align:center;color:var(--muted);margin:4px 0 20px}
#misshead{font-weight:600;margin:0 0 6px}
#miss{margin:0 0 22px;padding-left:20px}
#miss li{margin-bottom:6px}
</style>
</head>
<body>
<main>
  <h1>Peter’s Portuguese Verb Drill 🍪</h1>
  <p class="sub">European Portuguese. Type the form; accents count.</p>

  <section id="setup" class="card">
    <span class="lbl">Number of forms</span>
    <div class="seg" id="seg">
      <button data-v="10" aria-pressed="false">10</button>
      <button data-v="20" class="on" aria-pressed="true">20</button>
      <button data-v="30" aria-pressed="false">30</button>
    </div>
    <span class="lbl">Verbs</span>
    <div class="seg tight" id="kind">
      <button data-v="both" class="on" aria-pressed="true">Both</button>
      <button data-v="regular" aria-pressed="false">Regular</button>
      <button data-v="irregular" aria-pressed="false">Irregular</button>
    </div>
    <p class="hint">Regular: cantar, comer, abrir. Irregular: ser, estar, ter, haver.</p>
    <label class="switch">
      <input type="checkbox" id="vos" checked>
      <span class="track"></span>
      <span>Include <i>vós</i> forms (2pl)</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="syn">
      <span class="track"></span>
      <span>Synthetic forms only (no future or conditional)</span>
    </label>
    <button class="primary" id="start">Start</button>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="top"><span id="prog"></span><span id="score"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="verb" id="verb"></div>
    <div class="tense" id="tense"></div>
    <div class="who" id="who"></div>
    <input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer">
    <div id="fb" class="fb" hidden></div>
    <button class="primary" id="go">Check</button>
  </section>

  <section id="done" class="card" hidden>
    <div id="res"></div>
    <div id="pct"></div>
    <p id="misshead">Review these</p>
    <ul id="miss"></ul>
    <button class="primary" id="again">Play again</button>
    <button class="ghost" id="change">Change settings</button>
  </section>
</main>

<script>
const T=["Present","Preterite","Imperfect","Pluperfect (synthetic)","Future","Conditional","Present subjunctive","Imperfect subjunctive"];
const P=[["eu","1sg"],["tu","2sg"],["ele / ela","3sg"],["nós","1pl"],["vós","2pl"],["eles / elas","3pl"]];
const D={
cantar:["canto cantas canta cantamos cantais cantam","cantei cantaste cantou cantámos/cantamos cantastes cantaram","cantava cantavas cantava cantávamos cantáveis cantavam","cantara cantaras cantara cantáramos cantáreis cantaram","cantarei cantarás cantará cantaremos cantareis cantarão","cantaria cantarias cantaria cantaríamos cantaríeis cantariam","cante cantes cante cantemos canteis cantem","cantasse cantasses cantasse cantássemos cantásseis cantassem"],
comer:["como comes come comemos comeis comem","comi comeste comeu comemos comestes comeram","comia comias comia comíamos comíeis comiam","comera comeras comera comêramos comêreis comeram","comerei comerás comerá comeremos comereis comerão","comeria comerias comeria comeríamos comeríeis comeriam","coma comas coma comamos comais comam","comesse comesses comesse comêssemos comêsseis comessem"],
abrir:["abro abres abre abrimos abris abrem","abri abriste abriu abrimos abristes abriram","abria abrias abria abríamos abríeis abriam","abrira abriras abrira abríramos abríreis abriram","abrirei abrirás abrirá abriremos abrireis abrirão","abriria abririas abriria abriríamos abriríeis abririam","abra abras abra abramos abrais abram","abrisse abrisses abrisse abríssemos abrísseis abrissem"],
ser:["sou és é somos sois são","fui foste foi fomos fostes foram","era eras era éramos éreis eram","fora foras fora fôramos fôreis foram","serei serás será seremos sereis serão","seria serias seria seríamos seríeis seriam","seja sejas seja sejamos sejais sejam","fosse fosses fosse fôssemos fôsseis fossem"],
estar:["estou estás está estamos estais estão","estive estiveste esteve estivemos estivestes estiveram","estava estavas estava estávamos estáveis estavam","estivera estiveras estivera estivéramos estivéreis estiveram","estarei estarás estará estaremos estareis estarão","estaria estarias estaria estaríamos estaríeis estariam","esteja estejas esteja estejamos estejais estejam","estivesse estivesses estivesse estivéssemos estivésseis estivessem"],
ter:["tenho tens tem temos tendes têm","tive tiveste teve tivemos tivestes tiveram","tinha tinhas tinha tínhamos tínheis tinham","tivera tiveras tivera tivéramos tivéreis tiveram","terei terás terá teremos tereis terão","teria terias teria teríamos teríeis teriam","tenha tenhas tenha tenhamos tenhais tenham","tivesse tivesses tivesse tivéssemos tivésseis tivessem"],
haver:["hei hás há havemos/hemos haveis/heis hão","houve houveste houve houvemos houvestes houveram","havia havias havia havíamos havíeis haviam","houvera houveras houvera houvéramos houvéreis houveram","haverei haverás haverá haveremos havereis haverão","haveria haverias haveria haveríamos haveríeis haveriam","haja hajas haja hajamos hajais hajam","houvesse houvesses houvesse houvéssemos houvésseis houvessem"]
};

const $=id=>document.getElementById(id);
const norm=s=>s.trim().toLowerCase().normalize("NFC").replace(/\s+/g," ");
const REG=["cantar","comer","abrir"];
let n=20,kind="both",q=[],i=0,score=0,miss=[],phase="";

function show(id){["setup","quiz","done"].forEach(s=>$(s).hidden=s!==id)}

function seg(id,fn){
  const bs=document.querySelectorAll("#"+id+" button");
  bs.forEach(b=>b.onclick=()=>{
    fn(b.dataset.v);
    bs.forEach(x=>{
      x.classList.toggle("on",x===b);
      x.setAttribute("aria-pressed",String(x===b));
    });
  });
}
seg("seg",v=>{n=+v;});
seg("kind",v=>{kind=v;});

function start(){
  const vos=$("vos").checked,syn=$("syn").checked,pool=[];
  for(const v in D){
    if(kind==="regular"&&!REG.includes(v))continue;
    if(kind==="irregular"&&REG.includes(v))continue;
    D[v].forEach((s,t)=>{
      if(syn&&(t===4||t===5))return;
      s.split(" ").forEach((f,p)=>{
        if(p===4&&!vos)return;
        pool.push({v,t,p,a:f.split("/")});
      });
    });
  }
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]];}
  q=pool.slice(0,n);i=0;score=0;miss=[];
  show("quiz");render();
}

function render(){
  const c=q[i];phase="ask";
  $("prog").textContent="Question "+(i+1)+" of "+q.length;
  $("score").textContent="Score "+score;
  $("fill").style.width=(i/q.length*100)+"%";
  $("verb").textContent=c.v;
  $("tense").textContent=T[c.t];
  $("who").textContent=P[c.p][0]+" ("+P[c.p][1]+")";
  const a=$("ans");a.value="";a.readOnly=false;a.className="";
  $("fb").hidden=true;$("go").textContent="Check";
  a.focus();
}

function go(){
  if(phase==="ask"){
    const a=$("ans"),c=q[i],g=norm(a.value);
    if(!g)return;
    const ok=c.a.some(x=>norm(x)===g);
    if(ok)score++;else miss.push({c:c,g:a.value.trim()});
    a.readOnly=true;a.className=ok?"ok":"bad";
    const fb=$("fb");fb.hidden=false;fb.className="fb "+(ok?"ok":"bad");
    const others=c.a.filter(x=>norm(x)!==g);
    fb.textContent=ok?"Correct"+(others.length?" (also accepted: "+others.join(", ")+")":""):"Answer: "+c.a.join(" or ");
    $("score").textContent="Score "+score;
    $("fill").style.width=((i+1)/q.length*100)+"%";
    $("go").textContent=i===q.length-1?"See results":"Next";
    phase="review";
  }else{
    i++;
    if(i<q.length)render();else finish();
  }
}

function finish(){
  show("done");
  $("res").textContent=score+" / "+q.length;
  $("pct").textContent=Math.round(score/q.length*100)+"% correct"+(miss.length?"":", no mistakes");
  $("misshead").hidden=!miss.length;
  const L=$("miss");L.textContent="";
  miss.forEach(m=>{
    const li=document.createElement("li"),c=m.c;
    li.textContent=c.v+", "+T[c.t].toLowerCase()+", "+P[c.p][0]+": you wrote “"+m.g+"”, answer "+c.a.join(" or ");
    L.appendChild(li);
  });
}

$("start").onclick=start;
$("go").onclick=go;
$("again").onclick=start;
$("change").onclick=()=>show("setup");
$("ans").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.isComposing){e.preventDefault();if(!e.repeat)go();}
});
</script>
</body>
</html>
